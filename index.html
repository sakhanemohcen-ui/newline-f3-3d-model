<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apartment Walkthrough</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1d1f23;font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  button{touch-action:manipulation}
  #bar{position:fixed;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;flex-wrap:wrap}
  #title{background:rgba(24,22,20,.62);padding:8px 14px;border-radius:10px;backdrop-filter:blur(6px);font-size:14px;line-height:1.35}
  #title b{font-size:15px;letter-spacing:.02em}
  #room{color:#e9d9c2}
  #styles{display:flex;background:rgba(24,22,20,.62);border-radius:10px;padding:4px;backdrop-filter:blur(6px);pointer-events:auto}
  #styles button{cursor:pointer;border:0;border-radius:7px;padding:8px 14px;font:600 13px "Segoe UI",system-ui,sans-serif;background:transparent;color:#e8e2d9}
  #styles button:hover{background:rgba(255,255,255,.12)}
  #styles button.on{background:#f3ece1;color:#3b2e25}
  #actions{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
  #actions button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font:600 14px "Segoe UI",system-ui,sans-serif;
    background:#f3ece1;color:#3b2e25;box-shadow:0 4px 18px rgba(0,0,0,.35)}
  #actions button:hover{background:#fff}
  #actions #tourBtn{background:#f0c078}
  #actions #tourBtn:hover{background:#f7d49c}
  #card{position:fixed;left:24px;bottom:150px;max-width:330px;background:rgba(24,22,20,.8);padding:14px 18px 15px;border-radius:12px;backdrop-filter:blur(6px);
    opacity:0;transform:translateY(10px);transition:opacity .7s,transform .7s;pointer-events:none;line-height:1.4}
  #card.show{opacity:1;transform:none}
  #card small{color:#f0c078;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
  #card h2{margin:2px 0 0;font-size:22px;font-weight:600}
  #card .sz{color:#e9d9c2;font-size:14px;margin-bottom:6px}
  #card p{margin:0;font-size:14px}
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(24,22,20,.62);padding:7px 14px;border-radius:10px;
    font-size:13px;backdrop-filter:blur(6px);white-space:nowrap;pointer-events:none}
  #tod{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);background:rgba(24,22,20,.62);padding:8px 16px 7px;border-radius:12px;
    backdrop-filter:blur(6px);width:min(520px,calc(100vw - 60px));font-size:12px}
  #tod .row{display:flex;justify-content:space-between;align-items:baseline}
  #tod b{font-size:14px}
  #tod input{width:100%;accent-color:#f0c078;cursor:pointer;margin:4px 0 2px}
  #tod .ticks{position:relative;height:15px;color:#d8cfc2}
  #tod .ticks span{position:absolute}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,16,14,.6);backdrop-filter:blur(7px);padding:18px;z-index:5}
  #start .panel{background:rgba(22,20,18,.86);border:1px solid rgba(240,192,120,.28);padding:34px 40px 28px;border-radius:18px;text-align:center;max-width:460px;width:100%;box-sizing:border-box}
  #start small{color:#f0c078;letter-spacing:.22em;text-transform:uppercase;font-size:11px}
  #start h1{margin:10px 0 6px;font:600 34px/1.15 Georgia,"Times New Roman",serif;letter-spacing:.01em}
  #start .addr{margin:0;color:#d8cfc2;font-size:15px}
  #start .price{margin:18px 0 6px;font-size:24px;font-weight:600;color:#f3ece1}
  #start .facts{margin:0 0 22px;color:#d8cfc2;font-size:14px}
  #start .go{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #start button{cursor:pointer;border:0;border-radius:11px;padding:13px 30px;font:600 15px "Segoe UI",system-ui,sans-serif;background:#f0c078;color:#33271c}
  #start button:hover{background:#f7d49c}
  #start button.ghost{background:transparent;color:#f3ece1;border:1px solid rgba(243,236,225,.45)}
  #start button.ghost:hover{background:rgba(255,255,255,.1)}
  #start .how{margin:18px 0 0;color:#a89f93;font-size:12px;line-height:1.6}
  #contact{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(18,16,14,.6);backdrop-filter:blur(6px);padding:18px;z-index:6}
  #contact .panel{background:rgba(22,20,18,.92);border:1px solid rgba(240,192,120,.28);padding:28px 34px 24px;border-radius:16px;text-align:center;max-width:360px;width:100%;box-sizing:border-box}
  #contact small{color:#f0c078;letter-spacing:.2em;text-transform:uppercase;font-size:11px}
  #contact h2{margin:8px 0 4px;font:600 24px Georgia,serif}
  #contact p{margin:0 0 16px;color:#d8cfc2;font-size:14px}
  #contact a{display:block;margin:8px 0;padding:12px;border-radius:10px;background:#f0c078;color:#33271c;font-weight:600;text-decoration:none}
  #contact a.alt{background:transparent;color:#f3ece1;border:1px solid rgba(243,236,225,.45)}
  #contact button{margin-top:10px;cursor:pointer;border:0;background:transparent;color:#a89f93;font:14px "Segoe UI",system-ui,sans-serif;padding:8px 14px}
  #levels{position:fixed;right:16px;top:50%;transform:translateY(-50%);display:none;flex-direction:column-reverse;gap:6px}
  #levels button{cursor:pointer;border:0;border-radius:9px;padding:10px 12px;font:600 13px "Segoe UI",system-ui,sans-serif;background:rgba(24,22,20,.62);color:#e8e2d9}
  #levels button.on{background:#f3ece1;color:#3b2e25}
  #stick{position:fixed;left:22px;bottom:118px;width:112px;height:112px;border-radius:50%;background:rgba(24,22,20,.35);border:2px solid rgba(255,255,255,.4);display:none;touch-action:none}
  #stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(243,236,225,.88);pointer-events:none}
  body.touch #hint{display:none}
  body.touch #tod{bottom:14px}
  @media (max-width:760px){
    #bar{top:8px;left:8px;right:8px;gap:6px}
    #title{font-size:12px;padding:6px 10px} #title b{font-size:13px}
    #styles button{padding:7px 9px;font-size:12px}
    #actions{gap:6px} #actions button{padding:8px 10px;font-size:12px}
    #tod{width:calc(100vw - 44px);padding:6px 12px 5px;bottom:14px}
    #hint{display:none}
    #card{left:12px;right:12px;max-width:none;bottom:auto;top:168px;padding:10px 14px 11px}
    #card h2{font-size:18px}
    #start .panel{padding:26px 22px 22px} #start h1{font-size:27px}
  }
  @media (max-height:480px){
    #title{display:none}
    #card{top:auto;bottom:86px;left:150px;right:auto;max-width:300px}
    #stick{bottom:84px;width:92px;height:92px}
    #start .panel{padding:16px 22px 14px} #start h1{font-size:22px;margin:4px 0} #start .price{margin:8px 0 2px;font-size:19px} #start .facts{margin-bottom:10px} #start .how{display:none}
  }
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:15px;line-height:1.5;
    background:#1d1f23;z-index:20;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <div id="title"><b id="tName"></b> · 2 bed · ≈ 80 m²<br><span id="room">Entry hall</span></div>
  <div id="styles">
    <button data-style="luxe">Warm luxury</button>
    <button data-style="modern">Modern</button>
    <button data-style="scandi">Scandinavian</button>
  </div>
  <div id="actions">
    <button id="tourBtn">Start tour</button>
    <button id="musicBtn">Music: on</button>
    <button id="toggle">Dollhouse view (V)</button>
    <button id="contactBtn">Contact</button>
  </div>
</div>
<div id="hint"></div>
<div id="card"><small id="cardStep"></small><h2 id="cardName"></h2><div class="sz" id="cardSize"></div><p id="cardPoint"></p></div>
<div id="tod">
  <div class="row"><span>Time of day</span><b id="todLabel"></b></div>
  <input id="todRange" type="range" min="0" max="1000" value="233" aria-label="Time of day">
  <div class="ticks"><span style="left:0">Morning</span><span style="left:33.3%;transform:translateX(-50%)">Noon</span><span style="left:82%;transform:translateX(-50%)">Sunset</span><span style="right:0">Night</span></div>
</div>
<div id="stick"><i></i></div>
<div id="levels"></div>
<div id="start"><div class="panel">
  <small id="wTag"></small>
  <h1 id="wName"></h1>
  <p class="addr" id="wAddr"></p>
  <div class="price" id="wPrice"></div>
  <p class="facts" id="wFacts"></p>
  <div class="go"><button id="startBtn">Start</button><button id="startTourBtn" class="ghost">Guided tour</button></div>
  <p class="how" id="wHow"></p>
</div></div>
<div id="contact"><div class="panel">
  <small>Arrange a visit</small>
  <h2 id="cName"></h2>
  <p id="cRole"></p>
  <a id="cPhone"></a>
  <a id="cMail" class="alt"></a>
  <button id="cClose">Close</button>
</div></div>
<div id="err"></div>
<script>
  // Anything that stops the tour from starting is written on the screen, so it can be reported from a phone.
  function showErr(msg){ var e=document.getElementById('err'); e.style.display='flex';
    e.textContent='This 3D tour could not start on this device.\n\n'+msg+'\n\n'+navigator.userAgent; }
  window.addEventListener('error',function(e){ if(window.__tour) return;
    showErr(e.message||(e.target&&(e.target.src||e.target.href)?'Could not load '+(e.target.src||e.target.href):'Unknown loading error')); },true);
  window.addEventListener('unhandledrejection',function(e){ if(!window.__tour) showErr(String(e.reason&&e.reason.message||e.reason)); });
  setTimeout(function(){ if(!window.__tour&&document.getElementById('err').style.display!=='flex')
    showErr('The 3D engine did not load after 20 seconds. Check the internet connection, or the browser may be too old (iOS 15 or later is needed).'); },20000);
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/+esm';
import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/environments/RoomEnvironment.js/+esm';
import { Reflector } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/objects/Reflector.js/+esm';
import { RoundedBoxGeometry } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/geometries/RoundedBoxGeometry.js/+esm';

/* ----------------------------------------------------------------- listing */
// Everything the client sees about the listing. Leave a field empty to hide it.
const CONFIG={
  tag:'3D model',
  project:'Newline F3',
  address:'',
  price:'',                          // e.g. '24 500 000 DA' (shows "Price on request" while empty)
  facts:'2 bedrooms · 2 bathrooms · balcony · ≈ 80 m² (860 sq ft)',
  agent:'',                          // contact name
  role:'',                           // e.g. 'Sales advisor, SOPIMEM'
  phone:'',                          // e.g. '+213 5 55 00 00 00'
  email:''
};
// One entry per floor. This home is on a single level, so the level switch stays hidden.
const LEVELS=[{name:'Level 1',y:0,start:[10.5,6.75]}];
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
if(isTouch) document.body.classList.add('touch');
// Graphics level: 0 = computer, 1 = phone, 2 = lightest (a phone that already ran out of graphics memory once)
let liteSaved=location.hash==='#lite'; try{ liteSaved=liteSaved||!!sessionStorage.getItem('lite'); }catch(e){}
const LITE=isTouch?(liteSaved?2:1):0;

/* ------------------------------------------------------------------ setup */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:!LITE, powerPreference:'high-performance'});
let pixelRatio = LITE>1?1:Math.min(devicePixelRatio, LITE?1.25:2);
renderer.setPixelRatio(pixelRatio);
renderer.shadowMap.enabled = LITE<2;
renderer.shadowMap.type = THREE.PCFShadowMap;      // blurred by the light's shadow radius
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.debug.onShaderError = (gl, program) => showErr('Graphics shader error: ' + (gl.getProgramInfoLog(program) || 'unknown').slice(0, 400));
let lostTimer=0;
canvas.addEventListener('webglcontextlost', e => { e.preventDefault();
  if(LITE===1 && document.visibilityState==='visible'){            // first failure on a phone: reload once in the lightest mode
    try{ sessionStorage.setItem('lite','1'); }catch(_){}
    location.hash='lite'; location.reload(); return; }
  lostTimer=setTimeout(()=>showErr('The graphics memory ran out. Close other tabs and apps, then reload the page.'),4000); });
canvas.addEventListener('webglcontextrestored', () => { clearTimeout(lostTimer); document.getElementById('err').style.display='none'; });

const scene = new THREE.Scene();
const SKY = new THREE.Color(0xcfe2f3), STUDIO = new THREE.Color(0x24272c), WHITE = new THREE.Color(0xffffff);
scene.background = SKY;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.22;

const world = new THREE.Group(); scene.add(world);
const roof = new THREE.Group(); scene.add(roof);        // hidden in dollhouse view
const dollOnly = new THREE.Group(); scene.add(dollOnly); dollOnly.visible = false;

const H = 2.8;                 // ceiling height (m)
const solids = [];             // collision boxes [x1,z1,x2,z2]
const solid = (x1,z1,x2,z2)=>solids.push([x1,z1,x2,z2]);

/* --------------------------------------------------------------- textures */
let seed = 7;
const rnd = ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
function tex(size, draw, perMetre=1){                    // perMetre = repeats per metre of surface
  const px=Math.max(128,size*(LITE>1?.25:LITE?.5:1)), c=document.createElement('canvas'); c.width=c.height=px;
  const g2=c.getContext('2d'); g2.scale(px/size,px/size); draw(g2, size);       // phones draw the same pattern at half or quarter size
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=LITE?2:renderer.capabilities.getMaxAnisotropy(); t.repeat.set(perMetre,perMetre);
  return t;
}
const noise=(g,S,n,a=.06)=>{ for(let i=0;i<n;i++){ g.fillStyle=`rgba(${rnd()>.5?'255,255,255':'0,0,0'},${rnd()*a})`; g.fillRect(rnd()*S,rnd()*S,1+rnd()*3,1+rnd()*3); } };
const gridLines=(g,S,n,style,lw)=>{ g.strokeStyle=style; g.lineWidth=lw; for(let i=0;i<=n;i++){ const p=Math.min(S-1,Math.max(1,i*S/n)); g.beginPath(); g.moveTo(p,0); g.lineTo(p,S); g.moveTo(0,p); g.lineTo(S,p); g.stroke(); } };

const stone=({base,blobs,vein,va=.26,nv=11,vw=16,grout,speck=0})=>(g,S)=>{
  g.fillStyle=base; g.fillRect(0,0,S,S);
  for(let i=0;i<60;i++){ const x=rnd()*S,y=rnd()*S,r=60+rnd()*220, gr=g.createRadialGradient(x,y,0,x,y,r), col=blobs[i%blobs.length];
    gr.addColorStop(0,`rgba(${col},.22)`); gr.addColorStop(1,`rgba(${col},0)`); g.fillStyle=gr; g.fillRect(0,0,S,S); }
  g.filter='blur(3px)';
  for(let i=0;i<nv;i++){ let x=rnd()*S*1.4-S*.4, y=-30; g.beginPath(); g.moveTo(x,y); const slope=.35+rnd()*.6;
    for(let k=0;k<42;k++){ x+=S/40*slope+(rnd()-.5)*22; y+=S/40*1.12+(rnd()-.5)*8; g.lineTo(x,y); }
    g.strokeStyle=`rgba(${vein[0]+rnd()*20|0},${vein[1]+rnd()*16|0},${vein[2]+rnd()*16|0},${va*(.45+rnd())})`; g.lineWidth=1+rnd()*rnd()*vw; g.stroke(); }
  g.filter='none';
  if(speck) noise(g,S,speck,.16);
  if(grout) gridLines(g,S,2,grout,2);
};
const warm={base:'#f0ebe2',blobs:['226,215,198','252,249,244','214,202,184'],vein:[168,138,102]};
const tMarbleWarm=tex(1024,stone({...warm,grout:'rgba(120,104,88,.28)'}),1/2.4);            // 1.2 m floor tiles
const tCalacatta =tex(1024,stone({...warm,nv:8,va:.3}),1/1.5);
const cool={base:'#f3f3f1',blobs:['222,223,225','250,250,250','208,210,213'],vein:[112,114,120]};
const tMarbleGrey=tex(1024,stone({...cool,nv:8,va:.3,vw:10}),1/1.5);
const tGreyStone =tex(1024,stone({base:'#d9d9d5',blobs:['196,196,193','234,234,231','184,184,181'],vein:[150,150,148],va:.07,nv:5,speck:5000,grout:'rgba(80,80,80,.4)'}),1/2.4);
const tQuartz    =tex(512,stone({base:'#f4f2ee',blobs:['236,232,224','252,251,248'],vein:[200,196,188],va:.08,nv:3,speck:9000}),1/1.2);

const woodGrain=(base,dark,light,amt=1)=>(g,S)=>{       // grain runs along the canvas height
  g.fillStyle=base; g.fillRect(0,0,S,S);
  for(let i=0;i<34;i++){ g.fillStyle=`rgba(${i%2?dark:light},${(.03+rnd()*.08)*amt})`; g.fillRect(rnd()*S,0,8+rnd()*70,S); }
  for(let i=0;i<460;i++){ const x=rnd()*S, k=1+(rnd()*3|0), ph=rnd()*6.28, am=rnd()*5;
    g.strokeStyle=rnd()>.3?`rgba(${dark},${(.04+rnd()*.2)*amt})`:`rgba(${light},${(.03+rnd()*.12)*amt})`; g.lineWidth=.5+rnd()*2.2;
    g.beginPath(); for(let y=0;y<=S;y+=8){ const xx=x+Math.sin(y/S*6.2832*k+ph)*am; y?g.lineTo(xx,y):g.moveTo(xx,y); } g.stroke(); }
};
const tWalnut =tex(512,woodGrain('#7d593c','45,26,12','190,150,110'),1/.7);
const tPaleOak=tex(512,woodGrain('#d8c09a','140,105,65','250,238,215',.75),1/.7);
const tSmoked =tex(512,woodGrain('#4b3e35','18,12,8','125,104,88'),1/.7);
const tOakFloor=tex(1024,(g,S)=>{                        // 20 cm planks running along the long side of the home
  const rows=12,h=S/rows;
  for(let r=0;r<rows;r++){ let x=-rnd()*S*.5;
    while(x<S){ const w=S*(.4+rnd()*.45), l=rnd();
      g.fillStyle=`hsl(${32+l*5},${32+l*8}%,${64+l*11}%)`; g.fillRect(x,r*h,w,h);
      for(let i=0;i<16;i++){ const y=r*h+rnd()*h; g.strokeStyle=`rgba(${rnd()>.4?'120,85,50':'255,240,215'},${.05+rnd()*.14})`; g.lineWidth=.6+rnd()*1.6;
        g.beginPath(); g.moveTo(x,y); g.lineTo(x+w,y+(rnd()-.5)*5); g.stroke(); }
      g.fillStyle='rgba(70,48,28,.5)'; g.fillRect(x,r*h,1.5,h); x+=w; }
    g.fillStyle='rgba(70,48,28,.42)'; g.fillRect(0,r*h,S,1.5); }
},1/2.4);
const tile=(base,grout,n,sp=5000)=>(g,S)=>{ g.fillStyle=base; g.fillRect(0,0,S,S); noise(g,S,sp,.07); gridLines(g,S,n,grout,3); };
const tTileBeige=tex(512,tile('#d8cdbd','rgba(110,98,84,.55)',2),1/1.2);       // 60 cm
const tTileSlate=tex(512,tile('#8b8e92','rgba(52,54,58,.8)',2,9000),1/1.2);
const tTileWhite=tex(512,tile('#f4f4f1','rgba(150,152,155,.75)',8,2000),1/1.2); // 15 cm
const tTravertine=tex(512,(g,S)=>{
  g.fillStyle='#cdbfa9'; g.fillRect(0,0,S,S);
  for(let i=0;i<500;i++){ g.strokeStyle=`rgba(${rnd()>.5?'235,225,205':'150,132,108'},${.05+rnd()*.14})`; g.lineWidth=1+rnd()*3;
    const y=rnd()*S,x=rnd()*S; g.beginPath(); g.moveTo(x,y); g.lineTo(x+40+rnd()*160,y+(rnd()-.5)*6); g.stroke(); }
  gridLines(g,S,2,'rgba(100,88,72,.6)',3);
},1/1.2);
const tWeave=tex(256,(g,S)=>{                            // linen weave, tinted by the material colour
  g.fillStyle='#ececec'; g.fillRect(0,0,S,S);
  for(let i=0;i<S;i+=2){ g.fillStyle=`rgba(0,0,0,${.03+rnd()*.14})`; g.fillRect(0,i,S,1); g.fillStyle=`rgba(0,0,0,${.03+rnd()*.12})`; g.fillRect(i,0,1,S);
    g.fillStyle=`rgba(255,255,255,${rnd()*.3})`; g.fillRect(0,i+1,S,1); }
},1/.16);
const tBoucle=tex(256,(g,S)=>{                           // nubby boucle
  g.fillStyle='#e2e2e2'; g.fillRect(0,0,S,S);
  for(let i=0;i<2600;i++){ const v=175+rnd()*80|0; g.fillStyle=`rgba(${v},${v},${v},.75)`; g.beginPath(); g.arc(rnd()*S,rnd()*S,1.5+rnd()*4,0,7); g.fill(); }
},1/.28);

const rugTex={
  luxe:tex(512,(g,S)=>{ g.fillStyle='#e9e1d3'; g.fillRect(0,0,S,S); g.filter='blur(5px)';

function worldUV(geo,swap){                              // texture coordinates in metres, so grain and weave keep their real size
  const p=geo.attributes.position,n=geo.attributes.normal,uv=geo.attributes.uv,ou=rnd()*3,ov=rnd()*3;
  for(let i=0;i<p.count;i++){
    const ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i)),az=Math.abs(n.getZ(i));
    let u,v; if(ax>=ay&&ax>=az){u=p.getZ(i);v=p.getY(i);} else if(ay>=az){u=p.getX(i);v=p.getZ(i);} else {u=p.getX(i);v=p.getY(i);}
    swap?uv.setXY(i,v+ou,u+ov):uv.setXY(i,u+ou,v+ov);
  }
}
function B(x1,x2,y1,y2,z1,z2,mat,o={}){                  // box from its extents; o.r rounds the edges

  const geo=o.r?new RoundedBoxGeometry(w,h,d,3,Math.min(o.r,Math.min(w,h,d)*.49)):new THREE.BoxGeometry(w,h,d);
  if(!o.fit) worldUV(geo,o.swap);

  m.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
  m.castShadow=o.cast!==false; m.receiveShadow=o.receive!==false;
  if(Math.max(w,h,d)<.4) m.layers.set(DETAIL);

}

const todRange=document.getElementById('todRange'), todLabel=document.getElementById('todLabel');
function applyTime(){
  const h=hourCur, dT=(h-6)/14, el=58*Math.sin(Math.PI*dT), az=(-65+130*dT)*DEG, e=Math.max(el,3)*DEG;
  const dayK=sm(el,-4,12), n=1-dayK, w=1-sm(el,6,34), doll=mode==='doll';
  // the sun crosses the window facade from the left in the morning to the right at sunset
  sun.position.set(6.15+Math.sin(az)*Math.cos(e)*24, Math.sin(e)*24, 3.8-Math.cos(az)*Math.cos(e)*24);
  sun.color.copy(cNoon).lerp(h<13?cMorning:cSunset,w);
  sun.intensity=3.6*sm(el,-1,9)*(1-.2*w)*(doll?.65:1);
  let i=0; while(i<skyKeys.length-2&&h>skyKeys[i+1][0]) i++;
  skyCol.copy(skyKeys[i][1]).lerp(skyKeys[i+1][1],Math.max(0,Math.min(1,(h-skyKeys[i][0])/(skyKeys[i+1][0]-skyKeys[i][0]))));
  scene.background=doll?STUDIO:skyCol;
  ground.material.color.copy(groundDay).lerp(groundNight,n);
  scene.environmentIntensity=mix(.06,.22,dayK); hemi.intensity=n*(LITE&&doll?.8:.22)+(LITE?.12:0);
  renderer.toneMappingExposure=(doll?.9:.95)+n*.12;
  glowWarm.emissiveIntensity=mix(1.3,2.8,n); shade.emissiveIntensity=mix(.2,1.9,n); glowMat.opacity=n*.6;
  glass.opacity=mix(.14,.3,n); glass.envMapIntensity=mix(5,2,n);
  for(const q of lamps){
    tmpCol.copy(q.cd); if(q.sky) tmpCol.lerp(cGold,w*.7);
    q.col.copy(tmpCol).lerp(q.cn,n);
    q.int=mix(q.day[3]*(q.sky?dayK:1),q.night[3],n)*.6;
    q.pos.set(mix(q.day[0],q.night[0],n),mix(q.day[1],q.night[1],n),mix(q.day[2],q.night[2],n));
  }
  assignLights();
  const mm=Math.round(h*60), name=h<9.5?'Morning':h<16.5?'Day':h<18.3?'Afternoon':h<20.1?'Sunset':'Night';
  todLabel.textContent=String(mm/60|0).padStart(2,'0')+':'+String(mm%60).padStart(2,'0')+' · '+name;
}
function tickTime(dt){                                   // eases toward the slider so the light never jumps

}

canvas.addEventListener('mousedown',()=>drag=true); addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{
  if(mode==='walk'){ if(tour.on||(!locked()&&!drag)) return;
    player.yaw-=e.movementX*.0022; player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch-e.movementY*.0022)); }
  else if(drag){ orbit.az-=e.movementX*.006; orbit.pol=Math.max(.02,Math.min(1.3,orbit.pol-e.movementY*.005)); }
});
canvas.addEventListener('wheel',e=>{ if(mode==='doll'){ orbit.dist=Math.max(5,Math.min(60,orbit.dist*(1+Math.sign(e.deltaY)*.08))); e.preventDefault(); } },{passive:false});
function enterAt(cx,cy){                                 // jump into a room from the dollhouse
  if(mode!=='doll') return;
  const ray=new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(cx/innerWidth*2-1,-cy/innerHeight*2+1),dollCam);
  const p=new THREE.Vector3(); if(!ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),p)||blocked(p.x,p.z)) return;
  player.x=p.x; player.z=p.z; toggle();
}
canvas.addEventListener('dblclick',e=>enterAt(e.clientX,e.clientY));
// ---- touch: left stick walks, dragging anywhere else looks around, two fingers zoom the dollhouse
const joy={x:0,y:0,id:null}, stickEl=document.getElementById('stick'), knob=stickEl.firstElementChild;
function stickMove(t){ const r=stickEl.getBoundingClientRect(), half=r.width/2; let dx=(t.clientX-r.left-half)/(half*.75), dy=(t.clientY-r.top-half)/(half*.75);
  const m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; } joy.x=dx; joy.y=dy; knob.style.transform=`translate(${dx*half*.6}px,${dy*half*.6}px)`; }
stickEl.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; joy.id=t.identifier; stickMove(t); },{passive:false});
stickEl.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===joy.id) stickMove(t); },{passive:false});
const stickEnd=e=>{ for(const t of e.changedTouches) if(t.identifier===joy.id){ joy.id=null; joy.x=joy.y=0; knob.style.transform=''; } };
stickEl.addEventListener('touchend',stickEnd); stickEl.addEventListener('touchcancel',stickEnd);
const pts=new Map(); let pinch=0, tapT=0, tapX=0, tapY=0, lastTap=0;
canvas.addEventListener('touchstart',e=>{ e.preventDefault(); for(const t of e.changedTouches) pts.set(t.identifier,{x:t.clientX,y:t.clientY});
  pinch=0; if(e.touches.length===1){ tapT=performance.now(); tapX=e.touches[0].clientX; tapY=e.touches[0].clientY; } },{passive:false});
canvas.addEventListener('touchmove',e=>{ e.preventDefault();
  if(pts.size>=2&&mode==='doll'){
    for(const t of e.changedTouches){ const q=pts.get(t.identifier); if(q){ q.x=t.clientX; q.y=t.clientY; } }
    const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch) orbit.dist=Math.max(5,Math.min(60,orbit.dist*pinch/d)); pinch=d; return;
  }
  for(const t of e.changedTouches){ const q=pts.get(t.identifier); if(!q) continue; const dx=t.clientX-q.x, dy=t.clientY-q.y; q.x=t.clientX; q.y=t.clientY;
    if(mode==='walk'){ if(!tour.on){ player.yaw-=dx*.005; player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch-dy*.005)); } }
    else if(mode==='doll'){ orbit.az-=dx*.008; orbit.pol=Math.max(.02,Math.min(1.3,orbit.pol-dy*.006)); } }
},{passive:false});
const touchEnd=e=>{ for(const t of e.changedTouches){ pts.delete(t.identifier);
    if(performance.now()-tapT<260&&Math.hypot(t.clientX-tapX,t.clientY-tapY)<12){ const now=performance.now(); if(now-lastTap<380) enterAt(t.clientX,t.clientY); lastTap=now; } } pinch=0; };
canvas.addEventListener('touchend',touchEnd); canvas.addEventListener('touchcancel',touchEnd);
function toggle(){ if(tour.on) stopTour(); setMode(mode==='doll'?'walk':'doll'); }
function setMode(m){
  mode=m; const d=m==='doll';
  dollCam.fov=40; dollCam.updateProjectionMatrix();
  if(d&&locked()) document.exitPointerLock();
  roof.visible=!d; dollOnly.visible=d; ground.visible=!d; sun.shadow.needsUpdate=true;
  applyTime();
  btn.textContent=d?'Walk inside (V)':'Dollhouse view (V)';
  hintEl.textContent=d?'Drag to rotate · scroll to zoom · double-click a room to walk there'
                      :'W A S D move · Shift run · Q / E time of day · 1 2 3 styles';
  if(d){ startEl.style.display='none'; orbit.dist=fitDist(); }
}
// distance at which the whole plan fits the window, whatever its shape
function fitDist(){ return Math.max(18.5, 7.2/(Math.tan(THREE.MathUtils.degToRad(20))*(innerWidth/innerHeight))); }
btn.addEventListener('click',()=>{ toggle(); btn.blur(); });
document.querySelectorAll('#styles button').forEach(b=>b.addEventListener('click',()=>{ applyStyle(b.dataset.style); b.blur(); }));
applyStyle('luxe'); setMode('walk');

function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); walkCam.fov=w>=h?70:Math.min(92,2*Math.atan(Math.tan(30*Math.PI/180)/(w/h))*180/Math.PI);   // wider on portrait phones
  for(const c of [walkCam,dollCam]){ c.aspect=w/h; c.updateProjectionMatrix(); } }
addEventListener('resize',resize); resize();

/* ------------------------------------------------------------ guided tour */
// "to" walks to a point; "stop" pauses there, turns to "look" and shows the card [name, square feet, selling point]
const TOUR=[
  {stop:['Entry hall',32,'A full-height wardrobe wall keeps coats and shoes out of sight.'],look:[10.3,4.0]},
  {to:[10.4,5.4]},
  {stop:['Living room',215,'One open living and dining space, lit by a 3 m wide window.'],look:[11.2,3.0]},
  {to:[9.3,5.35]},{to:[9.2,4.6]},{to:[9.15,3.1]},
  {stop:['Dining area',85,'Seats six beside the window, a few steps from the kitchen.'],look:[10.6,1.1]},
  {to:[8.3,3.3]},{to:[7.9,2.5]},
  {stop:['Kitchen',76,'A long stone counter with built-in oven and hob, and its own window.'],look:[7.1,1.2]},
  {to:[7.9,4.0]},{to:[7.25,4.4]},
  {stop:['Corridor',41,'Keeps both bedrooms private, away from the living space.'],look:[4.0,4.4]},
  {to:[7.25,5.2]},
  {stop:['Bathroom 2',37,'Walk-in shower and floating vanity, right off the corridor for guests.'],look:[6.0,5.75]},
  {to:[7.25,4.4]},{to:[5.9,4.4]},{to:[5.9,3.45]},
  {stop:['Bedroom 2',118,'A twin room with a desk, built-in wardrobe and its own balcony door.'],look:[4.4,1.7]},
  {to:[5.9,4.4]},{to:[3.9,4.42]},{to:[2.5,4.45]},
  {stop:['Master bedroom',114,'Queen-size bed, sliding glass doors to the balcony and a private en-suite.'],look:[1.1,2.7]},
  {to:[1.45,4.55]},
  {stop:['Dressing area',23,'L-shaped wardrobes give a walk-in feel without taking bedroom space.'],look:[1.1,5.6]},
  {to:[2.5,4.5]},{to:[2.5,5.25]},
  {stop:['En-suite bathroom',37,'A private bathroom with walk-in shower, entered from the master.'],look:[3.9,5.8]},
  {to:[2.5,4.45]},{to:[2.48,3.95]},{to:[2.68,3.55]},{to:[2.68,1.95]},{to:[2.28,1.7]},{to:[2.28,1.12]},
  {stop:['Balcony',38,'A curved corner balcony that both bedrooms open onto.'],look:[.9,.4]},
];
const STOPS=TOUR.filter(q=>q.stop);
const tour={on:false,i:0,wait:0}, rise={t:0,from:new THREE.Vector3(),look:new THREE.Vector3()};
const tourBtn=document.getElementById('tourBtn'), musicBtn=document.getElementById('musicBtn'), cardEl=document.getElementById('card');
let cardTimer=0;
function showCard(st,step){
  document.getElementById('cardStep').textContent=step;
  document.getElementById('cardName').textContent=st[0];
  document.getElementById('cardSize').textContent='≈ '+st[1]+' sq ft';
  document.getElementById('cardPoint').textContent=st[2];
  cardEl.classList.add('show');
}
const hideCard=()=>{ clearTimeout(cardTimer); cardEl.classList.remove('show'); };
function startTour(){
  if(mode!=='walk') setMode('walk');
  startEl.style.display='none'; hideCard();
  Object.assign(player,{x:10.5,z:6.85,yaw:0,pitch:-.03});
  tour.on=true; tour.i=0; tour.wait=0; tourBtn.textContent='Stop tour';
  if(musicOn) startMusic();
}
function stopTour(){ tour.on=false; hideCard(); tourBtn.textContent='Start tour'; }
tourBtn.addEventListener('click',()=>{ tourBtn.blur(); if(tour.on) stopTour(); else if(mode==='rise'){ setMode('doll'); hideCard(); } else startTour(); });
function turnTo(tx,tz,dt,rate){                          // ease the view toward a point; returns how far off it still is
  let d=Math.atan2(-(tx-player.x),-(tz-player.z))-player.yaw; d=Math.atan2(Math.sin(d),Math.cos(d));
  player.yaw+=d*(1-Math.exp(-dt*rate)); return Math.abs(d);
}
function tickTour(dt){
  const st=TOUR[tour.i];
  if(!st){                                               // last stop done: lift off to the dollhouse
    tour.on=false; mode='rise'; rise.t=0; rise.from.set(player.x,EYE,player.z);
    rise.look.set(player.x-Math.sin(player.yaw)*3,1.3,player.z-Math.cos(player.yaw)*3);
    orbit.az=0; orbit.pol=.42; orbit.dist=fitDist(); return;
  }
  if(st.to){
    const dx=st.to[0]-player.x, dz=st.to[1]-player.z, dist=Math.hypot(dx,dz);
    if(dist<.03){ tour.i++; return; }
    const off=turnTo(st.to[0],st.to[1],dt,3.2);          // slows down while turning so it never walks sideways
    player.pitch+=(-.05-player.pitch)*(1-Math.exp(-dt*2));
    const step=Math.min(dist,.85*dt*Math.max(.12,Math.cos(Math.min(off,1.5))));
    player.x+=dx/dist*step; player.z+=dz/dist*step;
  }else{
    if(tour.wait===0) showCard(st.stop,(STOPS.indexOf(st)+1)+' / '+STOPS.length);
    tour.wait+=dt; turnTo(st.look[0],st.look[1],dt,1.7);
    player.pitch+=(-.1-player.pitch)*(1-Math.exp(-dt*2));
    if(tour.wait>4.3) hideCard();
    if(tour.wait>5){ tour.wait=0; tour.i++; }
  }
}
const riseTo=new THREE.Vector3(), riseAim=new THREE.Vector3(), riseCentre=new THREE.Vector3();
function tickRise(dt){
  rise.t+=dt; const k=sm(rise.t,0,6.5), sp=Math.sin(orbit.pol);
  riseTo.set(orbit.cx+orbit.dist*sp*Math.sin(orbit.az),orbit.dist*Math.cos(orbit.pol),orbit.cz+orbit.dist*sp*Math.cos(orbit.az));
  dollCam.position.lerpVectors(rise.from,riseTo,k);
  riseAim.lerpVectors(rise.look,riseCentre.set(orbit.cx,.8,orbit.cz),sm(rise.t,0,4.5));
  dollCam.fov=mix(70,40,k); dollCam.updateProjectionMatrix(); dollCam.lookAt(riseAim);
  if(roof.visible&&dollCam.position.y>2.5){ roof.visible=false; sun.shadow.needsUpdate=true; }   // the roof lifts off as the camera passes it
  renderer.render(scene,dollCam);
  if(rise.t>=6.5){
    setMode('doll'); tourBtn.textContent='Start tour';
    showCard(['The whole home',860,'Two bedrooms, two bathrooms and a balcony, all on one level.'],'Tour complete');
    cardTimer=setTimeout(hideCard,10000);
  }
}

/* ---------------------------------------------- background music, in code */
// a slow pad of four chords with sparse soft bell notes, built from oscillators; no audio files
let ac=null, master=null, bus=null, musicOn=true, nextChord=0, nextBell=0, chordIx=0;
const CHORDS=[[130.81,196.00,246.94,293.66,329.63],[110.00,164.81,261.63,329.63,392.00],[87.31,130.81,220.00,329.63,392.00],[98.00,146.83,246.94,293.66,440.00]];
const BELLS=[523.25,587.33,659.25,783.99,880.00,1046.50];
function pad(freq,t,dur){
  const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.045,t+3); g.gain.setValueAtTime(.045,t+dur-3.5); g.gain.linearRampToValueAtTime(0,t+dur); g.connect(bus);
  for(const [type,cents] of [['sine',0],['triangle',7],['sine',-6]]){ const o=ac.createOscillator(); o.type=type; o.frequency.value=freq; o.detune.value=cents; o.connect(g); o.start(t); o.stop(t+dur+.1); }
}
function bell(freq,t){
  const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+4);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t+4.1);
}
function schedule(){
  if(!ac||ac.state!=='running') return; const now=ac.currentTime;
  while(nextChord<now+2){ for(const f of CHORDS[chordIx%4]) pad(f,nextChord,10.5); chordIx++; nextChord+=8; }
  while(nextBell<now+1.5){ bell(BELLS[Math.random()*BELLS.length|0],nextBell); nextBell+=1.4+Math.random()*2.8; }
}
function startMusic(){
  if(!ac){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain(); master.gain.value=0; master.connect(ac.destination);
    bus=ac.createGain(); const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1700; bus.connect(lp); lp.connect(master);
    const delay=ac.createDelay(2), fb=ac.createGain(), wet=ac.createGain(); delay.delayTime.value=.46; fb.gain.value=.42; wet.gain.value=.4;   // echo for a sense of space
    lp.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
    nextChord=ac.currentTime+.1; nextBell=ac.currentTime+3; setInterval(schedule,400);
  }
  ac.resume(); master.gain.setTargetAtTime(musicOn?.55:0,ac.currentTime,.8);
}
musicBtn.addEventListener('click',()=>{
  musicBtn.blur(); musicOn=!musicOn; musicBtn.textContent='Music: '+(musicOn?'on':'off');
  if(musicOn) startMusic(); else if(ac) master.gain.setTargetAtTime(0,ac.currentTime,.25);
});

/* ------------------------------------------------------------------- loop */
const clock=new THREE.Clock(); let stickShown=false;
function frame(){
  const raw=clock.getDelta(), dt=Math.min(raw,.05);
  const showStick=isTouch&&mode==='walk'&&!tour.on&&startEl.style.display==='none';
  if(showStick!==stickShown){ stickShown=showStick; stickEl.style.display=showStick?'block':'none'; }
  tickTime(dt); tickQuality(raw); if(pool.length<lamps.length) assignLights();
  if(mode==='walk'){
    const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y, r=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
    if(tour.on) tickTour(dt); else if(f||r){
      const sp=(keys.ShiftLeft||keys.ShiftRight?3.8:2.1)*dt*Math.min(1,Math.hypot(f,r))/Math.hypot(f,r), s=Math.sin(player.yaw), c=Math.cos(player.yaw);
      const nx=player.x+(-s*f+c*r)*sp, nz=player.z+(-c*f-s*r)*sp;
      if(!blocked(nx,player.z)) player.x=nx;
      if(!blocked(player.x,nz)) player.z=nz;
    }
    walkCam.position.set(player.x,LEVELS[level].y+EYE,player.z); walkCam.rotation.set(player.pitch,player.yaw,0);
    const rm=rooms.find(q=>player.x>=q[1]&&player.x<=q[3]&&player.z>=q[2]&&player.z<=q[4]);
    const txt=STYLES[styleKey].label+' · '+(rm?rm[0]:'');
    if(roomEl.textContent!==txt) roomEl.textContent=txt;
    renderer.render(scene,walkCam);
  }else if(mode==='rise'){ tickRise(dt);
  }else{
    const sp=Math.sin(orbit.pol);
    dollCam.position.set(orbit.cx+orbit.dist*sp*Math.sin(orbit.az),orbit.dist*Math.cos(orbit.pol),orbit.cz+orbit.dist*sp*Math.cos(orbit.az));
    dollCam.lookAt(orbit.cx,.8,orbit.cz);
    marker.position.x=player.x; marker.position.z=player.z; marker.rotation.y=player.yaw;
    renderer.render(scene,dollCam);
  }
  requestAnimationFrame(frame);
}
window.__tour={joy,CONFIG,tour,TOUR,startTour,music:()=>({state:ac&&ac.state,musicOn,gain:master&&master.gain.value,chordIx}),mode:()=>mode,player,orbit,setMode,applyStyle,blocked,solids,renderer,scene,setHour:(h,now)=>{ hourTarget=h; todRange.value=(h-7)/15*1000; if(now){ hourCur=h; applyTime(); sun.shadow.needsUpdate=true; } },
  quality:()=>({LITE,lights:pool.length,reflectOn,pixelRatio,shadow:sun.shadow.mapSize.x})};
frame();
</script>
